services:
  postgres:
    image: postgres:16-alpine
    container_name: gestao_conformidade_db
    environment:
      POSTGRES_DB: gestao_conformidade
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
